<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to match</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #00d4aa 0%, #00a86b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: #333;
        }
        
        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
            font-size: 1.75rem;
            font-weight: 600;
        }
        
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        input {
            width: 100%;
            padding: 0.875rem 1rem;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.2s;
            background: #f9f9f9;
        }
        
        input:focus {
            outline: none;
            border-color: #00d4aa;
            background: white;
        }
        
        input::placeholder {
            color: #999;
        }
        
        #startLink {
            display: block;
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #00d4aa 0%, #00a86b 100%);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 1.5rem;
            border: none;
            cursor: pointer;
        }
        
        #startLink:active {
            transform: scale(0.98);
        }
        
        .settings-section {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e0e0e0;
        }
        
        .settings-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            font-weight: 500;
        }
        
        .settings-btn:active {
            background-color: #5a6268;
            transform: scale(0.98);
        }
        
        .url-status {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            min-height: 1.2rem;
            line-height: 1.4;
            padding: 0.5rem;
            border-radius: 6px;
            background: #f8f9fa;
        }
        
        .url-status.has-url {
            color: #28a745;
        }
        
        .url-status.no-url {
            color: #dc3545;
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 1.5rem;
                border-radius: 12px;
            }
            
            h1 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }
            
            input, #startLink, .settings-btn {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Log In</h1>
        <form>
            <input id="quole" type="number" placeholder="Quoles" min="0">
            <input id="teamNum" type="number" placeholder="Team #9999" min="1">
        </form>
        <a href="auto.html" id="startLink">Start Match</a>
        <div class="settings-section">
            <button id="changeUrlBtn" class="settings-btn">Change Google Sheets URL</button>
            <div id="urlStatus" class="url-status"></div>
        </div>
    </div>
</body>

<script src="Func.js"></script>
<script>

    // Function to update URL status display
    function updateUrlStatus() {
        const statusEl = document.getElementById('urlStatus');
        const currentUrl = getGoogleSheetsUrl();
        
        if (currentUrl) {
            // Show truncated URL
            const displayUrl = currentUrl.length > 60 
                ? currentUrl.substring(0, 60) + '...' 
                : currentUrl;
            statusEl.textContent = '✓ Google Sheets URL configured: ' + displayUrl;
            statusEl.className = 'url-status has-url';
        } else {
            statusEl.textContent = '⚠ No Google Sheets URL configured';
            statusEl.className = 'url-status no-url';
        }
    }
    
    // Function to handle change URL button click
    function handleChangeUrl() {
        const result = changeGoogleSheetsUrl();
        
        if (result.cancelled) {
            // User cancelled, do nothing
            return;
        }
        
        if (result.success) {
            alert(result.message);
            updateUrlStatus();
        } else {
            alert('Error: ' + result.message);
        }
    }
    
    // Wait for DOM to load, then set up the link and URL button
    document.addEventListener('DOMContentLoaded', function() {
        const link = document.getElementById('startLink');
        if (link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                if (saveLoginData()) {
                    window.location.href = 'auto.html';
                } else {
                    alert('Please enter both quole and team number');
                }
            });
        }
        
        // Set up change URL button
        const changeUrlBtn = document.getElementById('changeUrlBtn');
        if (changeUrlBtn) {
            changeUrlBtn.addEventListener('click', handleChangeUrl);
        }
        
        // Update URL status on page load
        updateUrlStatus();
    });
</script>

</html>
